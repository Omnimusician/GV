<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GV – materiały do nauki</title>

<style>
* { box-sizing: border-box; }

body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 1200px;
    margin: 0 auto;
    padding: 30px 20px;
    background: #f5f5f5;
    color: #222;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 25px;
}

h1 { margin: 0; }

select {
    font-size: 16px;
    padding: 8px 12px;
}

.layout {
    display: grid;
    grid-template-columns: minmax(0,1fr) minmax(300px,1fr);
    gap: 25px;
}

.panel {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.transport {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

button {
    font-size: 16px;
    padding: 9px 14px;
    cursor: pointer;
    border: 1px solid #bbb;
    border-radius: 7px;
    background: #fafafa;
}

button:hover { background: #eee; }

button.active {
    background: #222;
    color: white;
    border-color: #222;
}

button:disabled {
    opacity: .5;
    cursor: default;
}

#seek {
    width: 100%;
    cursor: pointer;
}

.time-row {
    display: flex;
    justify-content: space-between;
    margin-top: 5px;
    font-variant-numeric: tabular-nums;
}

#markerInfo {
    margin-top: 8px;
    font-size: 14px;
    color: #666;
}

#status {
    margin: 15px 0;
    font-size: 14px;
    color: #666;
}

#mixer { margin-top: 25px; }

.track {
    display: grid;
    grid-template-columns: 90px 1fr 45px 45px;
    gap: 10px;
    align-items: center;
    margin: 14px 0;
}

.track input { width: 100%; }

.lyrics {
    white-space: pre-wrap;
    line-height: 1.65;
    font-size: 17px;
    max-height: 70vh;
    overflow-y: auto;
}

.lyrics h2 { margin-top: 0; }

#lyricsText { white-space: pre-wrap; }

@media (max-width: 750px) {

    body {
        padding: 10px;
    }

    header {
        display: none;
    }

    .layout {
        display: block;
    }

    /* LEWY PANEL = PLAYER */
    .layout > .panel:first-child {
        position: sticky;
        top: 0;
        z-index: 100;

        padding: 8px 10px;
        border-radius: 0 0 10px 10px;

        box-shadow: 0 3px 10px rgba(0,0,0,.15);
    }

    /* Nazwa utworu */
    #songTitle {
        font-size: 15px;
        margin: 0 0 5px 0;
    }

    /* PLAY / PAUZA / WRÓĆ */
    .transport {
        margin: 0 0 5px 0;
        gap: 5px;
    }

    .transport button {
        font-size: 13px;
        padding: 5px 8px;
    }

    /* TIMELINE */
    #seek {
        margin: 2px 0;
        height: 18px;
    }

    .time-row {
        font-size: 11px;
        margin-top: 0;
    }

    #markerInfo {
        font-size: 10px;
        margin-top: 1px;
    }

    #status {
        display: none;
    }

    /* MIKSER */
    #mixer {
        margin-top: 5px;
    }

    .track {
        display: grid;

        grid-template-columns:
            55px
            minmax(60px, 1fr)
            32px
            32px;

        gap: 4px;

        margin: 3px 0;

        font-size: 11px;
    }

    .track input {
        width: 100%;
        height: 16px;
    }

    .track button {
        font-size: 11px;
        padding: 3px 2px;
        min-width: 0;
    }

    /* TEKST */
    .lyrics {
        margin-top: 10px;

        padding: 15px;

        max-height: none;

        font-size: 17px;
        line-height: 1.65;
    }

    .lyrics h2 {
        font-size: 18px;
        margin-top: 0;
    }
}
</style>
</head>

<body>

<header>
    <div>
        <h1>GV 🎶</h1>
        <div>Materiały do nauki głosów</div>
    </div>

    <select id="songSelect"></select>
</header>

<div class="layout">

    <div class="panel">

        <h2 id="songTitle"></h2>

        <div class="transport">
            <button id="play" disabled>▶ Play</button>
            <button id="pause" disabled>⏸ Pauza</button>
            <button id="return" disabled>↩ Wróć</button>
        </div>

        <input
            id="seek"
            type="range"
            min="0"
            max="100"
            value="0"
            step="0.01"
            disabled
        >

        <div class="time-row">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
        </div>

        <div id="markerInfo">
            Punkt powrotu: 0:00
        </div>

        <div id="status">
            Ładowanie...
        </div>

        <div id="mixer"></div>

    </div>

    <div class="panel lyrics">
        <h2>Tekst</h2>
        <div id="lyricsText">Ładowanie...</div>
    </div>

</div>

<script>

/* ===============================
   REPERTUAR
================================ */

const songs = {

    tradeItAll: {
        title: "Trade It All",
        folder: "utwory/trade%20it%20all/",

        tracks: [
            ["Podkład", "podklad.mp3"],
            ["Sopran", "sop.mp3"],
            ["Alt", "alt.mp3"],
            ["Tenor", "ten.mp3"]
        ],

        lyrics: "tekst.txt"
    }

};


/* ===============================
   ELEMENTY STRONY
================================ */

const songSelect = document.getElementById("songSelect");
const songTitle = document.getElementById("songTitle");

const mixer = document.getElementById("mixer");

const playButton = document.getElementById("play");
const pauseButton = document.getElementById("pause");
const returnButton = document.getElementById("return");

const seek = document.getElementById("seek");

const currentTimeDisplay = document.getElementById("currentTime");
const durationDisplay = document.getElementById("duration");
const markerInfo = document.getElementById("markerInfo");

const lyricsText = document.getElementById("lyricsText");
const statusDisplay = document.getElementById("status");


/* ===============================
   WEB AUDIO
================================ */

let audioContext = null;

let buffers = [];
let sources = [];
let gainNodes = [];

let trackStates = [];

let duration = 0;

let isPlaying = false;

/*
position = aktualna pozycja utworu,
kiedy player NIE gra.
*/
let position = 0;

/*
Czas AudioContext, w którym rozpoczęliśmy
aktualne odtwarzanie.
*/
let startedAt = 0;

let returnPoint = 0;

let loadingVersion = 0;


/* ===============================
   LISTA UTWORÓW
================================ */

Object.entries(songs).forEach(([id, song]) => {

    const option = document.createElement("option");

    option.value = id;
    option.textContent = song.title;

    songSelect.appendChild(option);

});


songSelect.addEventListener("change", () => {

    loadSong(songSelect.value);

});


/* ===============================
   AUDIO CONTEXT
================================ */

function getAudioContext() {

    if (!audioContext) {

        audioContext =
            new (window.AudioContext ||
                 window.webkitAudioContext)();

    }

    return audioContext;
}


/* ===============================
   WCZYTYWANIE UTWORU
================================ */

async function loadSong(id) {

    const version = ++loadingVersion;

    stopSources();

    isPlaying = false;
    position = 0;
    returnPoint = 0;

    buffers = [];
    gainNodes = [];
    trackStates = [];

    mixer.innerHTML = "";

    playButton.disabled = true;
    pauseButton.disabled = true;
    returnButton.disabled = true;
    seek.disabled = true;

    seek.value = 0;

    currentTimeDisplay.textContent = "0:00";
    durationDisplay.textContent = "0:00";

    updateMarkerDisplay();

    const song = songs[id];

    songTitle.textContent = song.title;

    statusDisplay.textContent =
        "Ładowanie ścieżek audio...";


    try {

        const context = getAudioContext();


        /*
        Pobieramy WSZYSTKIE MP3.
        */

        const loadedBuffers =
            await Promise.all(

                song.tracks.map(async ([name, file]) => {

                    const response =
                        await fetch(song.folder + file);

                    if (!response.ok) {
                        throw new Error(
                            `Nie udało się pobrać ${file}`
                        );
                    }

                    const arrayBuffer =
                        await response.arrayBuffer();

                    return await context.decodeAudioData(
                        arrayBuffer
                    );

                })

            );


        /*
        Jeśli użytkownik zmienił utwór
        podczas ładowania, ignorujemy wynik.
        */

        if (version !== loadingVersion) {
            return;
        }


        buffers = loadedBuffers;

        /*
        Jako długość utworu bierzemy
        najkrótszą ścieżkę.
        */

        duration = Math.min(
            ...buffers.map(buffer => buffer.duration)
        );


        durationDisplay.textContent =
            formatTime(duration);


        /*
        Tworzymy mikser.
        */

        song.tracks.forEach(([name], index) => {

            trackStates.push({
                volume: 1,
                muted: false,
                solo: false
            });


            const gain =
                context.createGain();

            gain.gain.value = 1;

            gain.connect(context.destination);

            gainNodes.push(gain);


            const row =
                document.createElement("div");

            row.className = "track";

            row.innerHTML = `
                <strong>${name}</strong>

                <input
                    type="range"
                    min="0"
                    max="1"
                    value="1"
                    step="0.01"
                    class="volume"
                >

                <button class="mute">M</button>
                <button class="solo">S</button>
            `;

            mixer.appendChild(row);


            const volume =
                row.querySelector(".volume");

            const mute =
                row.querySelector(".mute");

            const solo =
                row.querySelector(".solo");


            volume.addEventListener("input", () => {

                trackStates[index].volume =
                    Number(volume.value);

                updateMix();

            });


            mute.addEventListener("click", () => {

                trackStates[index].muted =
                    !trackStates[index].muted;

                mute.classList.toggle(
                    "active",
                    trackStates[index].muted
                );

                updateMix();

            });


            solo.addEventListener("click", () => {

                trackStates[index].solo =
                    !trackStates[index].solo;

                solo.classList.toggle(
                    "active",
                    trackStates[index].solo
                );

                updateMix();

            });

        });


        playButton.disabled = false;
        pauseButton.disabled = false;
        returnButton.disabled = false;
        seek.disabled = false;

        statusDisplay.textContent =
            "Gotowe";


    } catch (error) {

        console.error(error);

        statusDisplay.textContent =
            "Błąd ładowania audio: " + error.message;

    }


    /*
    Tekst może ładować się niezależnie.
    */

    lyricsText.textContent = "Ładowanie...";

    fetch(song.folder + song.lyrics)

        .then(response => {

            if (!response.ok) {
                throw new Error();
            }

            return response.text();

        })

        .then(text => {

            if (version === loadingVersion) {
                lyricsText.textContent = text;
            }

        })

        .catch(() => {

            if (version === loadingVersion) {

                lyricsText.textContent =
                    "Brak tekstu dla tego utworu.";

            }

        });

}


/* ===============================
   TWORZENIE ŹRÓDEŁ AUDIO

   To jest klucz synchronizacji.
================================ */

function createSources(offset) {

    const context = getAudioContext();

    sources = buffers.map((buffer, index) => {

        const source =
            context.createBufferSource();

        source.buffer = buffer;

        source.connect(gainNodes[index]);

        /*
        Wszystkie źródła wystartują
        według TEGO SAMEGO zegara.
        */

        return source;

    });


    /*
    Dajemy przeglądarce 50 ms zapasu
    i ustalamy JEDEN wspólny moment startu.
    */

    const startTime =
        context.currentTime + 0.05;


    sources.forEach(source => {

        source.start(
            startTime,
            offset
        );

    });


    startedAt =
        startTime - offset;

}


/* ===============================
   PLAY
================================ */

playButton.addEventListener("click", async () => {

    if (!buffers.length || isPlaying) {
        return;
    }


    const context = getAudioContext();

    if (context.state === "suspended") {
        await context.resume();
    }


    /*
    Jeśli jesteśmy na końcu,
    Play zaczyna od początku.
    */

    if (position >= duration) {
        position = 0;
    }


    createSources(position);

    isPlaying = true;

});


/* ===============================
   PAUZA
================================ */

pauseButton.addEventListener("click", () => {

    if (!isPlaying) {
        return;
    }


    position = getCurrentPosition();

    stopSources();

    isPlaying = false;

});


/* ===============================
   STOP ŹRÓDEŁ
================================ */

function stopSources() {

    sources.forEach(source => {

        try {
            source.stop();
        } catch (e) {}

        try {
            source.disconnect();
        } catch (e) {}

    });

    sources = [];

}


/* ===============================
   AKTUALNA POZYCJA
================================ */

function getCurrentPosition() {

    if (!isPlaying) {
        return position;
    }

    const context = getAudioContext();

    return Math.min(
        context.currentTime - startedAt,
        duration
    );

}


/* ===============================
   SEEK
================================ */

seek.addEventListener("input", () => {

    if (!duration) return;


    const newPosition =
        (Number(seek.value) / 100)
        * duration;


    /*
    Ręczne przesunięcie ustawia
    punkt powrotu.
    */

    returnPoint = newPosition;

    updateMarkerDisplay();


    /*
    Jeśli utwór gra, musimy utworzyć
    nowe BufferSource od nowej pozycji.
    */

    if (isPlaying) {

        stopSources();

        position = newPosition;

        createSources(position);

    } else {

        position = newPosition;

    }

});


/* ===============================
   WRÓĆ
================================ */

returnButton.addEventListener("click", () => {

    if (!duration) return;


    if (isPlaying) {

        stopSources();

        position = returnPoint;

        createSources(position);

    } else {

        position = returnPoint;

    }

});


/* ===============================
   MIXER
================================ */

function updateMix() {

    const anySolo =
        trackStates.some(state => state.solo);


    trackStates.forEach((state, index) => {

        let audible = true;


        if (state.muted) {
            audible = false;
        }


        if (anySolo && !state.solo) {
            audible = false;
        }


        gainNodes[index].gain.value =
            audible ? state.volume : 0;

    });

}


/* ===============================
   INTERFEJS
================================ */

function updateInterface() {

    if (duration) {

        let current =
            getCurrentPosition();


        /*
        Koniec utworu.
        */

        if (isPlaying && current >= duration) {

            stopSources();

            isPlaying = false;
            position = duration;

            current = duration;

        }


        seek.value =
            (current / duration) * 100;

        currentTimeDisplay.textContent =
            formatTime(current);

    }


    requestAnimationFrame(
        updateInterface
    );

}


/* ===============================
   PUNKT POWROTU
================================ */

function updateMarkerDisplay() {

    markerInfo.textContent =
        "Punkt powrotu: "
        + formatTime(returnPoint);

}


/* ===============================
   CZAS
================================ */

function formatTime(seconds) {

    if (!Number.isFinite(seconds)) {
        return "0:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60)
            .toString()
            .padStart(2, "0");

    return `${minutes}:${secs}`;

}


/* ===============================
   START
================================ */

loadSong(songSelect.value);

updateInterface();

</script>

</body>
</html>
