<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="gv%20flav.png?v=2">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GV – materiały do nauki</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 1200px;
    margin: 0 auto;
    padding: 30px 20px;
    background: #f5f5f5;
    color: #222;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 25px;
}

h1 {
    margin: 0;
}

select {
    font-size: 16px;
    padding: 8px 12px;
}

#mobileSongPicker {
    display: none;
}

.layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(300px, 1fr);
    gap: 25px;
}

.panel {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.transport {
    display: flex;
    gap: 4px;
    flex-wrap: nowrap;
    width: 100%;
    margin-bottom: 8px;
}

.transport > button {
    flex: 0 0 auto;
    white-space: nowrap;
}

button {
    font-size: 16px;
    padding: 9px 14px;
    cursor: pointer;
    border: 1px solid #bbb;
    border-radius: 7px;
    background: #fafafa;
}

button:hover {
    background: #eee;
}

button.active {
    background: #222;
    color: white;
    border-color: #222;
}

button:disabled {
    opacity: .5;
    cursor: default;
}

.skip-controls {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    flex: 1 1 0;
    min-width: 0;
    gap: 4px;
}

.skip-controls button {
    min-width: 0;
    width: 100%;
    padding: 6px 0;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
}

#seek {
    display: block;
    width: 100%;
    margin: 2px 0;
    cursor: pointer;
}

.time-row {
    display: flex;
    justify-content: space-between;
    margin-top: 5px;
    font-variant-numeric: tabular-nums;
}

#markerInfo {
    margin-top: 8px;
    font-size: 14px;
    color: #666;
}

#status {
    margin: 15px 0;
    font-size: 14px;
    color: #666;
}


/* =========================================
   SEKCJE UTWORU
========================================= */

#sectionsContainer {
    margin-top: 18px;
}

#sectionsTitle {
    margin-bottom: 7px;
    font-size: 12px;
    font-weight: 700;
    color: #777;
    text-transform: uppercase;
    letter-spacing: .08em;
}

#sections {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.section-button {
    font-size: 13px;
    padding: 6px 9px;
    white-space: nowrap;
}

.section-button .section-time {
    opacity: .6;
    margin-left: 3px;
}

.section-button.current {
    background: #222;
    color: white;
    border-color: #222;
}


/* =========================================
   MIKSER
========================================= */

#mixer {
    margin-top: 20px;
}

.track {
    display: grid;
    grid-template-columns: 90px 1fr 45px 45px;
    gap: 10px;
    align-items: center;
    margin: 14px 0;
}

.track input {
    width: 100%;
}


/* =========================================
   TEKST
========================================= */

.lyrics {
    line-height: 1.65;
    font-size: 17px;
    max-height: 70vh;
    overflow-y: auto;
}

.lyrics h2 {
    margin-top: 0;
    margin-bottom: 12px;
}

#lyricsText {
    white-space: pre-wrap;
}

.lyrics h2 {
    margin-top: 0;
}

#lyricsText {
    white-space: pre-wrap;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 750px) {

    body {
        padding: 0 10px 10px;
    }

    header {
        display: none;
    }

    #mobileSongPicker {
        display: block;
        margin-bottom: 8px;
    }

    #mobileSongPicker select {
        width: 100%;
        min-width: 0;
        min-height: 44px;
    }

    .layout {
        display: block;
    }

    .layout > .panel:first-child {
        position: sticky;
        top: 0;
        z-index: 100;

        padding: 8px 10px;
        border-radius: 0 0 10px 10px;

        box-shadow:
            0 3px 10px rgba(0,0,0,.15);
    }

    #songTitle {
        font-size: 15px;
        margin: 0 0 5px 0;
    }

    .transport {
        margin: 0 0 5px 0;
        gap: 3px;
    }

    .transport button {
        font-size: 13px;
        padding: 5px 4px;
    }

    .transport .skip-controls button {
        padding: 5px 0;
        font-size: 11px;
    }

    .skip-controls {
        gap: 3px;
    }

    #seek {
        margin: 2px 0;
        height: 18px;
    }

    .time-row {
        font-size: 11px;
        margin-top: 0;
    }

    #markerInfo {
        font-size: 10px;
        margin-top: 1px;
    }

    #status {
        display: none;
    }


    /* SEKCJE NA TELEFONIE */

    #sectionsContainer {
        margin-top: 5px;
    }

    #sectionsTitle {
        display: none;
    }

    #sections {
        flex-wrap: nowrap;
        overflow-x: auto;
        gap: 4px;

        padding: 2px 0 4px 0;

        scrollbar-width: thin;

        -webkit-overflow-scrolling: touch;
    }

    .section-button {
        flex: 0 0 auto;

        font-size: 10px;
        padding: 4px 6px;
    }


    /* MIKSER */

    #mixer {
        margin-top: 4px;
    }

    .track {
        grid-template-columns:
            55px
            minmax(60px, 1fr)
            32px
            32px;

        gap: 4px;
        margin: 3px 0;
        font-size: 11px;
    }

    .track input {
        width: 100%;
        height: 16px;
    }

    .track button {
        font-size: 11px;
        padding: 3px 2px;
        min-width: 0;
    }


    /* TEKST */

    .lyrics {
        margin-top: 10px;
        padding: 15px;

        max-height: none;

        font-size: 17px;
        line-height: 1.65;
    }

    .lyrics h2 {
        font-size: 18px;
        margin-top: 0;
    }
}
</style>
</head>


<body>

<header>

    <div>
        <h1>GV 🎶</h1>
        <div>Materiały do nauki głosów</div>
    </div>

    <select id="songSelect" aria-label="Wybierz utwór"></select>

</header>


<div class="layout">

    <!-- PLAYER -->

    <div class="panel">

        <div id="mobileSongPicker"></div>

        <h2 id="songTitle"></h2>


        <div class="transport">

            <button id="playPause" disabled>
                ▶ Play
            </button>

            <button id="return" disabled>
                ↩ Wróć
            </button>

        <div class="skip-controls" role="group" aria-label="Przewijanie o sekundy">
            <button type="button" data-skip="-10" aria-label="Cofnij o 10 sekund" disabled>−10 s</button>
            <button type="button" data-skip="-5" aria-label="Cofnij o 5 sekund" disabled>−5 s</button>
            <button type="button" data-skip="-2" aria-label="Cofnij o 2 sekundy" disabled>−2 s</button>
            <button type="button" data-skip="2" aria-label="Przewiń do przodu o 2 sekundy" disabled>+2 s</button>
            <button type="button" data-skip="5" aria-label="Przewiń do przodu o 5 sekund" disabled>+5 s</button>
            <button type="button" data-skip="10" aria-label="Przewiń do przodu o 10 sekund" disabled>+10 s</button>
        </div>
        </div>

        <input
            id="seek"
            type="range"
            min="0"
            max="100"
            value="0"
            step="0.01"
            disabled
        >


        <div class="time-row">

            <span id="currentTime">
                0:00
            </span>

            <span id="duration">
                0:00
            </span>

        </div>


        <div id="markerInfo">
            Punkt powrotu: 0:00
        </div>


        <div id="status">
            Ładowanie repertuaru...
        </div>


        <!-- SEKCJE -->

        <div
            id="sectionsContainer"
            hidden
        >

            <div id="sectionsTitle">
                Sekcje
            </div>

            <div id="sections"></div>

        </div>


        <!-- MIKSER -->

        <div id="mixer"></div>

    </div>


    <!-- TEKST -->

    <div class="panel lyrics">

        <h2>Tekst</h2>

        <div id="lyricsText">
            Ładowanie...
        </div>

    </div>

</div>



<script>

/* =========================================
   REPERTUAR
========================================= */

let songs = {};


/* =========================================
   ELEMENTY
========================================= */

const songSelect =
    document.getElementById("songSelect");

const desktopSongPicker = songSelect.parentElement;
const mobileSongPicker = document.getElementById("mobileSongPicker");
const mobileLayout = window.matchMedia("(max-width: 750px)");

function placeSongPicker() {
    const container = mobileLayout.matches
        ? mobileSongPicker
        : desktopSongPicker;
    container.appendChild(songSelect);
}

mobileLayout.addEventListener("change", placeSongPicker);
placeSongPicker();

const songTitle =
    document.getElementById("songTitle");

const mixer =
    document.getElementById("mixer");

const playPauseButton =
    document.getElementById("playPause");

const returnButton =
    document.getElementById("return");

const seek =
    document.getElementById("seek");

const skipButtons =
    document.querySelectorAll("[data-skip]");

const currentTimeDisplay =
    document.getElementById("currentTime");

const durationDisplay =
    document.getElementById("duration");

const markerInfo =
    document.getElementById("markerInfo");

const lyricsText =
    document.getElementById("lyricsText");

const statusDisplay =
    document.getElementById("status");

const sectionsContainer =
    document.getElementById(
        "sectionsContainer"
    );

const sectionsElement =
    document.getElementById(
        "sections"
    );


/* =========================================
   WEB AUDIO
========================================= */

let audioContext = null;

let buffers = [];

let trackStates = [];

let duration = 0;

let isPlaying = false;

let position = 0;


let returnPoint = 0;

let loadingVersion = 0;

// A real media element lets the OS manage background audio and lock-screen controls.
function configurePlaybackSession() {
    // iOS: use the music category rather than audio silenced by the Ring/Silent switch.
    try {
        if (navigator.audioSession) navigator.audioSession.type = "playback";
    } catch (error) {
        console.warn("Nie udało się ustawić sesji odtwarzania:", error);
    }
}

configurePlaybackSession();
const player = document.createElement("audio");
player.preload = "auto";
player.setAttribute("playsinline", "");
player.hidden = true;
document.body.appendChild(player);
let mixURL = null;
let mixVersion = 0;
let mixTimer = null;
let lastMediaPositionUpdate = 0;
let resumeAfterInterruption = false;
let liveSources = [];
let liveGains = [];
let mixDirty = false;

function stopLiveSources() {
    liveSources.forEach(source => { try { source.stop(); } catch (_) {} });
    liveSources = [];
    liveGains = [];
}

function applyLiveLevels() {
    const anySolo = trackStates.some(state => state.solo);
    const headroom = Math.max(1, buffers.length);
    liveGains.forEach((gain, index) => {
        const state = trackStates[index];
        const level = state.muted || (anySolo && !state.solo) ? 0 : state.volume;
        gain.gain.setTargetAtTime(level / headroom, audioContext.currentTime, 0.01);
    });
}

function startLiveSources(offset) {
    stopLiveSources();
    if (document.hidden || offset >= duration) return;
    const context = getAudioContext();
    if (context.state !== "running") context.resume().catch(console.error);
    buffers.forEach(buffer => {
        const source = context.createBufferSource();
        const gain = context.createGain();
        gain.gain.value = 0;
        source.buffer = buffer;
        source.connect(gain).connect(context.destination);
        liveSources.push(source);
        liveGains.push(gain);
    });
    applyLiveLevels();
    const start = context.currentTime + 0.02;
    liveSources.forEach(source => source.start(start, offset));
}

function scheduleMix() {
    clearTimeout(mixTimer);
    if (!mixDirty) return;
    mixTimer = setTimeout(() => {
        prepareMix().catch(error => {
            console.error(error);
            statusDisplay.textContent = "Nie udało się zmienić miksu. Spróbuj ponownie.";
        });
    }, 200);
}

function handlePlaybackError(error) {
    if (error.name === "AbortError") return;
    resumeAfterInterruption = false;
    position = player.currentTime || position;
    isPlaying = false;
    updatePlayPauseButton();
    statusDisplay.textContent = "Dotknij Play, aby wznowić dźwięk.";
}

// Render all voices onto one timeline, so background playback cannot desynchronize them.
async function prepareMix(songVersion = loadingVersion) {
    const version = ++mixVersion;
    const offline = new OfflineAudioContext(2, Math.ceil(duration * 44100), 44100);
    const anySolo = trackStates.some(state => state.solo);
    const levels = trackStates.map(state =>
        state.muted || (anySolo && !state.solo) ? 0 : state.volume);
    const headroom = Math.max(1, buffers.length);
    buffers.forEach((buffer, index) => {
        const source = offline.createBufferSource();
        const gain = offline.createGain();
        source.buffer = buffer;
        gain.gain.value = levels[index] / headroom;
        source.connect(gain).connect(offline.destination);
        source.start();
    });
    const rendered = await offline.startRendering();
    if (version !== mixVersion || songVersion !== loadingVersion || (mixDirty && isPlaying && !document.hidden)) return;
    const wav = new ArrayBuffer(44 + rendered.length * 4);
    const view = new DataView(wav);
    const write = (offset, text) => {
        for (let i = 0; i < text.length; i++) view.setUint8(offset + i, text.charCodeAt(i));
    };
    write(0, "RIFF"); view.setUint32(4, wav.byteLength - 8, true);
    write(8, "WAVEfmt "); view.setUint32(16, 16, true);
    view.setUint16(20, 1, true); view.setUint16(22, 2, true);
    view.setUint32(24, 44100, true); view.setUint32(28, 176400, true);
    view.setUint16(32, 4, true); view.setUint16(34, 16, true);
    write(36, "data"); view.setUint32(40, wav.byteLength - 44, true);
    const channels = [rendered.getChannelData(0), rendered.getChannelData(1)];
    for (let i = 0; i < rendered.length; i++) {
        for (let ch = 0; ch < 2; ch++) {
            const sample = Math.max(-1, Math.min(1, channels[ch][i]));
            view.setInt16(44 + i * 4 + ch * 2, sample * (sample < 0 ? 32768 : 32767), true);
        }
    }
    const offset = getCurrentPosition();
    const playing = isPlaying;
    const previousURL = mixURL;
    mixURL = URL.createObjectURL(new Blob([wav], {type: "audio/wav"}));
    player.src = mixURL;
    player.load();
    player.currentTime = Math.min(offset, duration);
    if (previousURL) URL.revokeObjectURL(previousURL);
    if (playing) player.play().catch(handlePlaybackError);
    mixDirty = false;
    statusDisplay.textContent = "Gotowe";
}

player.addEventListener("play", () => {
    if (!document.hidden && !liveSources.length) {
        player.muted = true;
        startLiveSources(player.currentTime);
    }
    isPlaying = true;
    resumeAfterInterruption = false;
    updatePlayPauseButton();
    updateMediaSession();
});
player.addEventListener("pause", () => {
    if (!player.paused || !isPlaying || player.ended) return;
    stopLiveSources();
    position = player.currentTime;
    isPlaying = false;
    updatePlayPauseButton();
    updateMediaSession();
});
player.addEventListener("ended", () => {
    stopLiveSources();
    position = duration;
    isPlaying = false;
    resumeAfterInterruption = false;
    updatePlayPauseButton();
    updateMediaSession();
});

function updateMediaSession() {
    if (!("mediaSession" in navigator)) return;
    const state = isPlaying ? "playing" : "paused";
    if (navigator.mediaSession.playbackState !== state) {
        navigator.mediaSession.playbackState = state;
        lastMediaPositionUpdate = 0;
    }
    const now = performance.now();
    if (duration && navigator.mediaSession.setPositionState && now - lastMediaPositionUpdate > 1000) {
        lastMediaPositionUpdate = now;
        navigator.mediaSession.setPositionState({duration, playbackRate: 1,
            position: Math.max(0, Math.min(getCurrentPosition(), duration))});
    }
}

if ("mediaSession" in navigator) {
    const actions = {
        play: () => { if (buffers.length && mixURL) createSources(position >= duration ? 0 : position); },
        pause: () => { resumeAfterInterruption = false; stopSources(); },
        seekbackward: event => skipBy(-(event.seekOffset || 10)),
        seekforward: event => skipBy(event.seekOffset || 10),
        seekto: event => skipBy(event.seekTime - getCurrentPosition())
    };
    for (const [action, handler] of Object.entries(actions)) {
        try { navigator.mediaSession.setActionHandler(action, handler); } catch (_) {}
    }
}

document.addEventListener("visibilitychange", () => {
    if (!document.hidden) configurePlaybackSession();
    if (document.hidden) {
        stopLiveSources();
        player.muted = false;
        scheduleMix();
        resumeAfterInterruption = isPlaying;
    } else {
        if (isPlaying && !player.paused) {
            player.muted = true;
            startLiveSources(player.currentTime);
        }
        if (resumeAfterInterruption && player.paused && !player.ended && mixURL) {
        resumeAfterInterruption = false;
        player.play().catch(handlePlaybackError);
        }
    }
});
window.addEventListener("pageshow", () => {
    configurePlaybackSession();
    if (resumeAfterInterruption && player.paused && !player.ended && mixURL) {
        resumeAfterInterruption = false;
        player.play().catch(handlePlaybackError);
    }
});



/*
Sekcje aktualnego utworu.

Każda sekcja po przetworzeniu ma:

{
    name: "Refren 1",
    time: 45
}
*/

let currentSections = [];

let lastActiveSection = -1;


/* =========================================
   AUDIO CONTEXT
========================================= */

function getAudioContext() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    return audioContext;
}


/* =========================================
   ZMIANA UTWORU
========================================= */

songSelect.addEventListener(
    "change",
    () => {

        loadSong(
            songSelect.value
        );

    }
);


/* =========================================
   WCZYTYWANIE UTWORU
========================================= */

async function loadSong(id) {

    const version =
        ++loadingVersion;

    clearTimeout(mixTimer);
    ++mixVersion;
    mixDirty = false;
    resumeAfterInterruption = false;
    stopSources();
    player.removeAttribute("src");
    player.load();
    if (mixURL) URL.revokeObjectURL(mixURL);
    mixURL = null;

    isPlaying = false;

    position = 0;
    returnPoint = 0;

    duration = 0;

    currentSections = [];
    lastActiveSection = -1;

    updatePlayPauseButton();

    buffers = [];
    trackStates = [];

    mixer.innerHTML = "";

    sectionsElement.innerHTML = "";
    sectionsContainer.hidden = true;

    playPauseButton.disabled = true;
    returnButton.disabled = true;
    seek.disabled = true;
    skipButtons.forEach(button => button.disabled = true);

    seek.value = 0;

    currentTimeDisplay.textContent =
        "0:00";

    durationDisplay.textContent =
        "0:00";

    updateMarkerDisplay();


    const song =
        songs[id];

    if (!song) {
        return;
    }


    songTitle.textContent =
        song.title;
    if ("mediaSession" in navigator && "MediaMetadata" in window) {
        navigator.mediaSession.metadata = new MediaMetadata({title: song.title, artist: "GV"});
    }


    statusDisplay.textContent =
        "Ładowanie ścieżek audio...";


    /* =====================================
       SEKCJE
    ===================================== */

    if (
        Array.isArray(song.sections) &&
        song.sections.length
    ) {

        currentSections =
            song.sections
                .map(
                    ([name, time]) => {

                        return {

                            name: name,

                            time:
                                parseTimestamp(
                                    time
                                )

                        };

                    }
                )

                .filter(
                    section =>
                        Number.isFinite(
                            section.time
                        )
                )

                .sort(
                    (a, b) =>
                        a.time - b.time
                );


        renderSections();

    }


    /* =====================================
       TEKST
    ===================================== */

    lyricsText.textContent =
        "Ładowanie...";


    fetch(
        song.folder +
        song.lyrics
    )

        .then(response => {

            if (!response.ok) {
                throw new Error();
            }

            return response.text();

        })

        .then(text => {

            if (
                version ===
                loadingVersion
            ) {

                lyricsText.textContent =
                    text;

            }

        })

        .catch(() => {

            if (
                version ===
                loadingVersion
            ) {

                lyricsText.textContent =
                    "Brak tekstu dla tego utworu.";

            }

        });


    /* =====================================
       AUDIO
    ===================================== */

    try {

        const context =
            getAudioContext();


        const loadedBuffers =
            await Promise.all(

                song.tracks.map(
                    async ([name, file]) => {

                        const response =
                            await fetch(
                                song.folder +
                                file
                            );


                        if (!response.ok) {

                            throw new Error(
                                "Nie udało się pobrać " +
                                file
                            );

                        }


                        const arrayBuffer =
                            await response
                                .arrayBuffer();


                        return await
                            context
                                .decodeAudioData(
                                    arrayBuffer
                                );

                    }
                )

            );


        if (
            version !==
            loadingVersion
        ) {
            return;
        }


        buffers =
            loadedBuffers;


        duration =
            Math.min(
                ...buffers.map(
                    buffer =>
                        buffer.duration
                )
            );


        durationDisplay.textContent =
            formatTime(
                duration
            );


        /* =================================
           MIKSER
        ================================= */

        song.tracks.forEach(
            ([name], index) => {

                trackStates.push({

                    volume: 1,
                    muted: false,
                    solo: false

                });


                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "track";


                row.innerHTML = `

                    <strong>${name}</strong>

                    <input
                        type="range"
                        min="0"
                        max="1"
                        value="1"
                        step="0.01"
                        class="volume"
                    >

                    <button class="mute">
                        M
                    </button>

                    <button class="solo">
                        S
                    </button>

                `;


                mixer.appendChild(
                    row
                );


                const volume =
                    row.querySelector(
                        ".volume"
                    );

                const mute =
                    row.querySelector(
                        ".mute"
                    );

                const solo =
                    row.querySelector(
                        ".solo"
                    );


                /* GŁOŚNOŚĆ */

                volume.addEventListener(
                    "input",
                    () => {

                        trackStates[index]
                            .volume =
                            Number(
                                volume.value
                            );

                        updateMix();

                    }
                );


                /* MUTE */

                mute.addEventListener(
                    "click",
                    () => {

                        trackStates[index]
                            .muted =
                            !trackStates[index]
                                .muted;


                        mute.classList.toggle(
                            "active",
                            trackStates[index]
                                .muted
                        );


                        updateMix();

                    }
                );


                /* SOLO */

                solo.addEventListener(
                    "click",
                    () => {

                        trackStates[index]
                            .solo =
                            !trackStates[index]
                                .solo;


                        solo.classList.toggle(
                            "active",
                            trackStates[index]
                                .solo
                        );


                        updateMix();

                    }
                );

            }
        );


        do {
            await prepareMix(version);
            if (version !== loadingVersion) return;
        } while (!mixURL);

        playPauseButton.disabled =
            false;

        returnButton.disabled =
            false;

        seek.disabled =
            false;
        skipButtons.forEach(button => button.disabled = false);


        statusDisplay.textContent =
            "Gotowe";


        updateActiveSection(0);

    }

    catch (error) {

        console.error(
            error
        );


        statusDisplay.textContent =

            "Błąd ładowania audio: " +
            error.message;

    }

}


/* =========================================
   SEKCJE – RENDEROWANIE
========================================= */

function renderSections() {

    sectionsElement.innerHTML =
        "";


    if (
        !currentSections.length
    ) {

        sectionsContainer.hidden =
            true;

        return;

    }


    sectionsContainer.hidden =
        false;


    currentSections.forEach(
        (section, index) => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "section-button";


            button.innerHTML =

                `<span>${section.name}</span>` +

                `<span class="section-time">` +

                formatTime(
                    section.time
                ) +

                `</span>`;


            button.addEventListener(
                "click",
                () => {

                    jumpToSection(
                        index
                    );

                }
            );


            sectionsElement.appendChild(
                button
            );

        }
    );

}


/* =========================================
   SKOK DO SEKCJI

   WAŻNE:
   NIE ZMIENIAMY PLAY / PAUZA.

   Jeśli grało -> gra dalej.
   Jeśli było zatrzymane -> zostaje.
========================================= */

function skipBy(seconds) {

    if (!duration || !buffers.length) {
        return;
    }

    const newPosition = Math.max(
        0,
        Math.min(duration, getCurrentPosition() + seconds)
    );

    if (isPlaying) {
        stopSources();
        position = newPosition;
        createSources(position);
    }
    else {
        position = newPosition;
    }

    seek.value = (newPosition / duration) * 100;
    currentTimeDisplay.textContent = formatTime(newPosition);
    updateActiveSection(newPosition);
}

skipButtons.forEach(button => {
    button.addEventListener("click", () => {
        skipBy(Number(button.dataset.skip));
    });
});

function jumpToSection(index) {

    const section =
        currentSections[index];


    if (!section) {
        return;
    }


    const newPosition =
        Math.min(
            section.time,
            duration
        );


    /*
    Timestamp automatycznie staje się
    punktem ↩ Wróć.
    */

    returnPoint =
        newPosition;


    updateMarkerDisplay();


    /*
    Jeżeli utwór gra:
    zatrzymujemy stare źródła
    i natychmiast tworzymy nowe
    od wskazanego miejsca.

    isPlaying cały czas pozostaje TRUE.
    */

    if (isPlaying) {

        stopSources();

        position =
            newPosition;

        createSources(
            position
        );

    }

    else {

        /*
        Jeśli była pauza,
        tylko zmieniamy pozycję.

        isPlaying pozostaje FALSE.
        */

        position =
            newPosition;

    }


    /*
    Aktualizacja UI od razu,
    bez czekania na kolejną klatkę.
    */

    seek.value =

        duration
            ? (
                newPosition /
                duration
              ) * 100
            : 0;


    currentTimeDisplay.textContent =
        formatTime(
            newPosition
        );


    updateActiveSection(
        newPosition
    );

}


/* =========================================
   AKTYWNA SEKCJA
========================================= */

function updateActiveSection(
    currentTime
) {

    if (
        !currentSections.length
    ) {
        return;
    }


    let activeIndex = -1;


    for (
        let i = 0;
        i < currentSections.length;
        i++
    ) {

        if (
            currentTime >=
            currentSections[i].time
        ) {

            activeIndex = i;

        }

        else {

            break;

        }

    }


    if (
        activeIndex ===
        lastActiveSection
    ) {
        return;
    }


    lastActiveSection =
        activeIndex;


    const buttons =
        sectionsElement
            .querySelectorAll(
                ".section-button"
            );


    buttons.forEach(
        (button, index) => {

            button.classList.toggle(
                "current",
                index === activeIndex
            );

        }
    );

}


/* =========================================
   TIMESTAMP "2:15" -> SEKUNDY
========================================= */

function parseTimestamp(value) {

    /*
    Pozwalamy również wpisać
    zwykłą liczbę sekund.
    */

    if (
        typeof value === "number"
    ) {

        return value;

    }


    if (
        typeof value !== "string"
    ) {

        return NaN;

    }


    const parts =
        value
            .trim()
            .split(":")
            .map(Number);


    /*
    1:23
    */

    if (
        parts.length === 2
    ) {

        return (
            parts[0] * 60 +
            parts[1]
        );

    }


    /*
    Opcjonalnie obsługujemy też:
    1:02:15
    */

    if (
        parts.length === 3
    ) {

        return (
            parts[0] * 3600 +
            parts[1] * 60 +
            parts[2]
        );

    }


    /*
    "45" = 45 sekund
    */

    if (
        parts.length === 1 &&
        Number.isFinite(
            parts[0]
        )
    ) {

        return parts[0];

    }


    return NaN;

}


/* =========================================
   TWORZENIE ŹRÓDEŁ AUDIO
========================================= */

function createSources(offset) {
    configurePlaybackSession();
    player.muted = !document.hidden;
    if (!document.hidden) startLiveSources(offset);
    player.currentTime = Math.max(0, Math.min(offset, duration));
    player.play().catch(handlePlaybackError);
}


/* =========================================
   PLAY / PAUZA
========================================= */

playPauseButton.addEventListener(
    "click",
    async () => {

        if (
            !buffers.length
        ) {
            return;
        }


        /* PAUZA */

        if (isPlaying) {

            position =
                getCurrentPosition();


            stopSources();


            isPlaying =
                false;


            updatePlayPauseButton();

            return;

        }


        /* PLAY */

        /*
        Play po zakończeniu utworu
        startuje od początku.
        */

        if (
            position >=
            duration
        ) {

            position = 0;

        }


        createSources(
            position
        );


        isPlaying =
            true;


        updatePlayPauseButton();

    }
);


/* =========================================
   WYGLĄD PLAY / PAUZA
========================================= */

function updatePlayPauseButton() {

    if (isPlaying) {

        playPauseButton.textContent =
            "⏸ Pauza";


        playPauseButton
            .classList
            .add(
                "active"
            );

    }

    else {

        playPauseButton.textContent =
            "▶ Play";


        playPauseButton
            .classList
            .remove(
                "active"
            );

    }

}


/* =========================================
   ZATRZYMANIE SOURCES
========================================= */

function stopSources() {
    stopLiveSources();
    player.pause();
}

function getCurrentPosition() {
    return isPlaying ? Math.min(player.currentTime, duration) : position;
}


/* =========================================
   RĘCZNY SEEK

   Również ustawia punkt powrotu.
========================================= */

seek.addEventListener(
    "input",
    () => {

        if (!duration) {
            return;
        }


        const newPosition =

            (
                Number(
                    seek.value
                ) /
                100
            )

            * duration;


        returnPoint =
            newPosition;


        updateMarkerDisplay();


        if (isPlaying) {

            stopSources();


            position =
                newPosition;


            createSources(
                position
            );

        }

        else {

            position =
                newPosition;

        }


        updateActiveSection(
            newPosition
        );

    }
);


/* =========================================
   WRÓĆ
========================================= */

returnButton.addEventListener(
    "click",
    () => {

        if (!duration) {
            return;
        }


        /*
        Tak samo jak timestamp:
        NIE zmienia trybu play/pauza.
        */

        if (isPlaying) {

            stopSources();


            position =
                returnPoint;


            createSources(
                position
            );

        }

        else {

            position =
                returnPoint;

        }


        updateActiveSection(
            returnPoint
        );

    }
);


/* =========================================
   MIXER
========================================= */

function updateMix() {
    ++mixVersion;
    mixDirty = true;
    applyLiveLevels();
    if (document.hidden || !isPlaying) scheduleMix();
}


/* =========================================
   AKTUALIZACJA UI
========================================= */

function updateInterface() {

    if (duration) {

        let current =
            getCurrentPosition();


        seek.value =

            (
                current /
                duration
            )

            * 100;


        currentTimeDisplay.textContent =
            formatTime(
                current
            );


        /*
        Automatycznie podświetlamy
        aktualną sekcję.
        */

        updateActiveSection(
            current
        );

    }


    updateMediaSession();
    requestAnimationFrame(
        updateInterface
    );

}


/* =========================================
   PUNKT POWROTU
========================================= */

function updateMarkerDisplay() {

    markerInfo.textContent =

        "Punkt powrotu: " +
        formatTime(
            returnPoint
        );

}


/* =========================================
   FORMAT CZASU
========================================= */

function formatTime(seconds) {

    if (
        !Number.isFinite(
            seconds
        )
    ) {

        return "0:00";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        Math.floor(
            seconds % 60
        )
        .toString()
        .padStart(
            2,
            "0"
        );


    return (
        minutes +
        ":" +
        secs
    );

}


/* =========================================
   INICJALIZACJA
========================================= */

async function initializePlayer() {

    try {

        statusDisplay.textContent =
            "Ładowanie repertuaru...";


        const response =
            await fetch(
                "songs.json"
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "Nie udało się pobrać songs.json"
            );

        }


        songs =
            await response.json();


        songSelect.innerHTML =
            "";


        Object.entries(
            songs
        )
        .forEach(
            ([id, song]) => {

                const option =
                    document
                        .createElement(
                            "option"
                        );


                option.value =
                    id;


                option.textContent =
                    song.title;


                songSelect
                    .appendChild(
                        option
                    );

            }
        );


        if (
            songSelect.value
        ) {

            await loadSong(
                songSelect.value
            );

        }

        else {

            statusDisplay.textContent =
                "Brak utworów w songs.json";

        }

    }

    catch (error) {

        console.error(
            error
        );


        statusDisplay.textContent =

            "Błąd wczytywania repertuaru: " +
            error.message;

    }

}


/* =========================================
   START
========================================= */

initializePlayer();

updateInterface();

</script>
