<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GV – materiały do nauki</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 1200px;
        margin: 0 auto;
        padding: 30px 20px;
        background: #f5f5f5;
        color: #222;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 25px;
    }

    h1 {
        margin: 0;
    }

    select {
        font-size: 16px;
        padding: 8px 12px;
    }

    .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(300px, 1fr);
        gap: 25px;
    }

    .panel {
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .transport {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 20px;
    }

    button {
        font-size: 16px;
        padding: 9px 14px;
        cursor: pointer;
        border: 1px solid #bbb;
        border-radius: 7px;
        background: #fafafa;
    }

    button:hover {
        background: #eee;
    }

    button.active {
        background: #222;
        color: white;
        border-color: #222;
    }

    #seek {
        width: 100%;
        cursor: pointer;
    }

    .time-row {
        display: flex;
        justify-content: space-between;
        margin-top: 5px;
        font-variant-numeric: tabular-nums;
    }

    #markerInfo {
        margin-top: 8px;
        font-size: 14px;
        color: #666;
    }

    #mixer {
        margin-top: 30px;
    }

    .track {
        display: grid;
        grid-template-columns: 90px 1fr 45px 45px;
        gap: 10px;
        align-items: center;
        margin: 14px 0;
    }

    .track input {
        width: 100%;
    }

    .lyrics {
        white-space: pre-wrap;
        line-height: 1.65;
        font-size: 17px;
        max-height: 70vh;
        overflow-y: auto;
    }

    .lyrics h2 {
        margin-top: 0;
    }

    #lyricsText {
        white-space: pre-wrap;
    }

    @media (max-width: 750px) {
        header {
            align-items: flex-start;
            flex-direction: column;
        }

        .layout {
            grid-template-columns: 1fr;
        }

        .track {
            grid-template-columns: 75px 1fr 42px 42px;
        }

        .lyrics {
            max-height: none;
        }
    }
</style>
</head>

<body>

<header>
    <div>
        <h1>GV 🎶</h1>
        <div>Materiały do nauki głosów</div>
    </div>

    <select id="songSelect"></select>
</header>

<div class="layout">

    <div class="panel">

        <h2 id="songTitle"></h2>

        <div class="transport">
            <button id="play">▶ Play</button>
            <button id="pause">⏸ Pauza</button>
            <button id="return">↩ Wróć</button>
        </div>

        <input
            id="seek"
            type="range"
            min="0"
            max="100"
            value="0"
            step="0.01"
        >

        <div class="time-row">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
        </div>

        <div id="markerInfo">
            Punkt powrotu: 0:00
        </div>

        <div id="mixer"></div>

    </div>

    <div class="panel lyrics">
        <h2>Tekst</h2>
        <div id="lyricsText">Ładowanie...</div>
    </div>

</div>


<script>

/* ==========================================
   REPERTUAR
   Tutaj później dopisujemy kolejne utwory.
========================================== */

const songs = {

    tradeItAll: {
        title: "Trade It All",
        folder: "utwory/trade%20it%20all/",

        tracks: [
            ["Podkład", "podklad.mp3"],
            ["Sopran", "sop.mp3"],
            ["Alt", "alt.mp3"],
            ["Tenor", "ten.mp3"]
        ],

        lyrics: "tekst.txt"
    }

};


/* ==========================================
   PLAYER
========================================== */

const songSelect = document.getElementById("songSelect");
const songTitle = document.getElementById("songTitle");

const mixer = document.getElementById("mixer");

const playButton = document.getElementById("play");
const pauseButton = document.getElementById("pause");
const returnButton = document.getElementById("return");

const seek = document.getElementById("seek");

const currentTimeDisplay =
    document.getElementById("currentTime");

const durationDisplay =
    document.getElementById("duration");

const markerInfo =
    document.getElementById("markerInfo");

const lyricsText =
    document.getElementById("lyricsText");


let audios = [];
let trackStates = [];

let returnPoint = 0;
let currentSong = null;


/* ==========================================
   LISTA UTWORÓW
========================================== */

Object.entries(songs).forEach(([id, song]) => {

    const option = document.createElement("option");

    option.value = id;
    option.textContent = song.title;

    songSelect.appendChild(option);
});


songSelect.addEventListener("change", () => {

    loadSong(songSelect.value);

});


/* ==========================================
   WCZYTYWANIE UTWORU
========================================== */

function loadSong(id) {

    stopAll();

    currentSong = songs[id];

    songTitle.textContent = currentSong.title;

    mixer.innerHTML = "";

    audios = [];
    trackStates = [];

    returnPoint = 0;

    updateMarkerDisplay();


    /* AUDIO */

    currentSong.tracks.forEach(([name, file], index) => {

        const audio =
            new Audio(currentSong.folder + file);

        audio.preload = "auto";

        audios.push(audio);

        trackStates.push({
            muted: false,
            solo: false
        });


        const row =
            document.createElement("div");

        row.className = "track";

        row.innerHTML = `
            <strong>${name}</strong>

            <input
                type="range"
                min="0"
                max="1"
                value="1"
                step="0.01"
                class="volume"
            >

            <button class="mute">M</button>
            <button class="solo">S</button>
        `;

        mixer.appendChild(row);


        const volume =
            row.querySelector(".volume");

        const mute =
            row.querySelector(".mute");

        const solo =
            row.querySelector(".solo");


        volume.addEventListener("input", () => {

            audio.volume =
                Number(volume.value);

        });


        mute.addEventListener("click", () => {

            trackStates[index].muted =
                !trackStates[index].muted;

            mute.classList.toggle(
                "active",
                trackStates[index].muted
            );

            updateMuteSolo();

        });


        solo.addEventListener("click", () => {

            trackStates[index].solo =
                !trackStates[index].solo;

            solo.classList.toggle(
                "active",
                trackStates[index].solo
            );

            updateMuteSolo();

        });

    });


    /* CZAS */

    audios[0].addEventListener(
        "loadedmetadata",
        () => {

            durationDisplay.textContent =
                formatTime(audios[0].duration);

        }
    );


    /* TEKST */

    lyricsText.textContent = "Ładowanie...";

    fetch(currentSong.folder + currentSong.lyrics)

        .then(response => {

            if (!response.ok) {
                throw new Error();
            }

            return response.text();

        })

        .then(text => {

            lyricsText.textContent = text;

        })

        .catch(() => {

            lyricsText.textContent =
                "Brak tekstu dla tego utworu.";

        });

}


/* ==========================================
   MUTE / SOLO
========================================== */

function updateMuteSolo() {

    const anySolo =
        trackStates.some(track => track.solo);


    audios.forEach((audio, index) => {

        const state =
            trackStates[index];

        if (anySolo) {

            audio.muted =
                !state.solo || state.muted;

        } else {

            audio.muted =
                state.muted;

        }

    });

}


/* ==========================================
   PLAY
========================================== */

playButton.addEventListener("click", async () => {

    if (!audios.length) return;

    const position =
        audios[0].currentTime;


    audios.forEach(audio => {

        audio.currentTime = position;

    });


    try {

        await Promise.all(
            audios.map(audio => audio.play())
        );

    } catch (error) {

        console.error(
            "Nie udało się uruchomić audio:",
            error
        );

    }

});


/* ==========================================
   PAUZA
========================================== */

pauseButton.addEventListener("click", () => {

    audios.forEach(audio => {

        audio.pause();

    });

});


/* ==========================================
   RĘCZNE PRZESUNIĘCIE SUWAKA

   Każde ręczne przesunięcie ustawia
   nowy punkt powrotu.
========================================== */

seek.addEventListener("input", () => {

    if (
        !audios.length ||
        !Number.isFinite(audios[0].duration)
    ) {
        return;
    }


    const position =
        (Number(seek.value) / 100)
        * audios[0].duration;


    audios.forEach(audio => {

        audio.currentTime = position;

    });


    returnPoint = position;

    updateMarkerDisplay();

});


/* ==========================================
   WRÓĆ DO PUNKTU
========================================== */

returnButton.addEventListener("click", () => {

    audios.forEach(audio => {

        audio.currentTime = returnPoint;

    });

});


/* ==========================================
   WYŚWIETLANIE PUNKTU POWROTU
========================================== */

function updateMarkerDisplay() {

    markerInfo.textContent =
        "Punkt powrotu: "
        + formatTime(returnPoint);

}


/* ==========================================
   FORMAT CZASU
========================================== */

function formatTime(seconds) {

    if (!Number.isFinite(seconds)) {
        return "0:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60)
        .toString()
        .padStart(2, "0");

    return `${minutes}:${secs}`;

}


/* ==========================================
   AKTUALIZACJA INTERFEJSU
========================================== */

function updateInterface() {

    if (
        audios.length &&
        Number.isFinite(audios[0].duration)
    ) {

        const master =
            audios[0];

        seek.value =
            (master.currentTime /
             master.duration) * 100;

        currentTimeDisplay.textContent =
            formatTime(master.currentTime);

        durationDisplay.textContent =
            formatTime(master.duration);

    }

    requestAnimationFrame(
        updateInterface
    );

}


/* ==========================================
   STOP
========================================== */

function stopAll() {

    audios.forEach(audio => {

        audio.pause();

        audio.currentTime = 0;

    });

}


/* ==========================================
   START
========================================== */

loadSong(songSelect.value);

updateInterface();

</script>

</body>
</html>
